# LSTM — conf1: Higher capacity, longer sequence
general:
  model_type: lstm
  conf_name: conf1

training:
  learning_rate: 1e-4
  epochs: 250
  batch_size: 128
  early_stopping_max: 40
  min_delta: 0.1   # 0.1 means: val loss must improve by at least 0.1 % of the best val loss
  scheduler_patience: 15
  weight_decay: 1e-4

lstm:
  hidden_dim: 128
  num_layers: 3
  dropout: 0.2
  seq_len: 30
