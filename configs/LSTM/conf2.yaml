# LSTM — conf2: Short sequence, simpler model (faster)
general:
  model_type: lstm
  conf_name: conf2

training:
  learning_rate: 5e-4
  epochs: 150
  batch_size: 256
  early_stopping_max: 20
  scheduler_patience: 10
  weight_decay: 1e-5

lstm:
  hidden_dim: 32
  num_layers: 1
  dropout: 0.0
  seq_len: 7
