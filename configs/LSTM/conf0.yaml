# LSTM — conf0: Baseline LSTM
general:
  model_type: lstm
  conf_name: conf0

training:
  learning_rate: 1e-4
  epochs: 200
  batch_size: 256
  early_stopping_max: 30
  scheduler_patience: 10
  weight_decay: 5e-5

lstm:
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1
  seq_len: 14
