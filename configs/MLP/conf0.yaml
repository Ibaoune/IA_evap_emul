# MLP — conf0: Baseline MLP
general:
  model_type: mlp
  conf_name: conf0

training:
  learning_rate: 1e-4
  epochs: 150
  batch_size: 256
  early_stopping_max: 30
  min_delta: 0.1   # 0.1 means: val loss must improve by at least 0.1 % of the best val loss
  scheduler_patience: 10
  weight_decay: 5e-5

mlp:
  hidden_dims: [128, 64]
  dropout: 0.1
