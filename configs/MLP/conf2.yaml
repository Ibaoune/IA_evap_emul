# MLP — conf2: Deeper, narrower network
general:
  model_type: mlp
  conf_name: conf2

training:
  learning_rate: 5e-5
  epochs: 250
  batch_size: 128
  early_stopping_max: 50
  min_delta: 0.1   # 0.1 means: val loss must improve by at least 0.1 % of the best val loss
  scheduler_patience: 10
  weight_decay: 1e-5

mlp:
  hidden_dims: [64, 64, 64, 32]
  dropout: 0.15
