# ConvLSTM — conf2: Very short sequence, fast execution
general:
  model_type: convlstm
  conf_name: conf2

training:
  learning_rate: 5e-4
  epochs: 100
  batch_size: 64
  early_stopping_max: 15
  min_delta: 0.5   # 0.1 means: val loss must improve by at least 0.1 % of the best val loss
  scheduler_patience: 5
  weight_decay: 1e-5

convlstm:
  seq_len: 3
  hidden_channels: 16
