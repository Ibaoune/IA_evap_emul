# AutoEncoder — conf0
general:
  model_type: autoencoder

training:
  learning_rate: 1e-4
  epochs: 100
  batch_size: 128
  early_stopping_max: 15
  min_delta: 0.5   # 0.1 means: val loss must improve by at least 0.1 % of the best val loss
  scheduler_patience: 5
  weight_decay: 1e-4

autoencoder:
  latent_dim: 256
