# MLP — conf1: Wider network with higher dropout
general:
  model_type: mlp
  conf_name: conf1

training:
  learning_rate: 1e-4
  epochs: 200
  batch_size: 256
  early_stopping_max: 40
  min_delta: 0.1   # 0.1 means: val loss must improve by at least 0.1 % of the best val loss
  scheduler_patience: 15
  weight_decay: 1e-4

mlp:
  hidden_dims: [256, 128, 64]
  dropout: 0.3
