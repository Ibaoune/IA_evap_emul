# AutoEncoder — conf2: Smaller latent dimension (stronger bottleneck)
general:
  model_type: autoencoder
  save_model: "yes"   # "yes" = save trained weights in results/<model>/<conf>/, "no" = do not save
  conf_name: conf2

training:
  learning_rate: 1e-4
  epochs: 150
  batch_size: 128
  early_stopping_max: 20
  min_delta: 0.5   # 0.1 means: val loss must improve by at least 0.1 % of the best val loss
  scheduler_patience: 10
  weight_decay: 1e-4

autoencoder:
  latent_dim: 128
