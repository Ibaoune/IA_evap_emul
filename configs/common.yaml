general:
  verbose: true
  model_type: xgb    # overridden by each model config

training:
  learning_rate: 1e-4
  epochs: 10
  batch_size: 128
  loss_type: BernoulliGamma
  early_stopping_max: 30
  scheduler_patience: 10
  weight_decay: 8e-5

dates:
  train:
    start: 1979
    end: 1979
  val:
    start: 2004
    end: 2004
  test:
    start: 2009
    end: 2009

region:
  lon_min: -18
  lon_max: 0
  lat_min: 20
  lat_max: 36

