# RCAN — conf0
general:
  model_type: rcan

training:
  learning_rate: 1e-4
  epochs: 300
  batch_size: 128
  early_stopping_max: 50
  min_delta: 0.5   # 0.1 means: val loss must improve by at least 0.1 % of the best val loss
  scheduler_patience: 15
  weight_decay: 5e-3

rcan:
  n_feat: 32
  n_groups: 5
  n_rcab: 6
  reduction: 8
