general:
  verbose: true
  model_type: xgb    # lstm | mlp | xgb | mlr_rf

training:
  learning_rate: 1e-4
  epochs: 5
  batch_size: 128
  loss_type: BernoulliGamma
  early_stopping_max: 30
  scheduler_patience: 10
  weight_decay: 8e-5

lstm:
  hidden_dim: 128
  num_layers: 2
  dropout: 0.2
  seq_len: 7

mlp:
  batch_size: 64
  hidden_layers: [64, 32]
  dropout: 0.2

xgb:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  n_jobs: -1

mlr_rf:
  n_estimators: 100
  max_depth: 8
  n_jobs: -1

dates:
  train:
    start: 1979
    end: 2003
  val:
    start: 2004
    end: 2008
  test:
    start: 2009
    end: 2014

region:
  lon_min: -18
  lon_max: 0
  lat_min: 20
  lat_max: 36

